<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2A25">
<title>نواقص الصيدلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E2A25; --paper:#F6F5F1; --card:#FFFFFF; --line:#E1E6E2;
  --green:#146E5B; --green-soft:#E6F1ED; --alert:#B3261E; --alert-soft:#FBEBEA;
  --muted:#6B7A74; --amber:#8A5A00; --amber-soft:#FBF1DC;
  --r:10px; --shadow:0 1px 0 rgba(14,42,37,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;
  background:var(--paper); color:var(--ink);
  font-size:15px; line-height:1.6;
  -webkit-text-size-adjust:100%;
  padding-bottom:86px;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.en{direction:ltr;unicode-bidi:isolate}

/* ---------- top ---------- */
header{
  position:sticky;top:0;z-index:40;background:var(--ink);color:#EAF2EF;
  padding:12px 14px 0; padding-top:max(12px,env(safe-area-inset-top));
}
.brandrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.today{font-size:13px;color:#9DB8B0;margin-inline-start:auto}
.status{font-size:11.5px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.1);color:#B9D3CB}
.status.on{background:#1E4F44;color:#8FE0C8}
.status.off{background:#4A2F2C;color:#F0B3AE}
nav{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  padding:9px 14px;color:#9DB8B0;font-size:14px;font-weight:500;white-space:nowrap;
  border-bottom:2.5px solid transparent;
}
nav button[aria-current="true"]{color:#fff;border-bottom-color:#6FD2B4}

main{max-width:760px;margin:0 auto;padding:14px}
.view{display:none}
.view.on{display:block}

/* ---------- search + filters ---------- */
.searchwrap{position:relative;margin-bottom:10px}
.searchwrap input{
  width:100%;padding:13px 42px 13px 14px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);
}
.searchwrap input::placeholder{color:#9AA8A2}
.searchwrap .ico{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);color:#9AA8A2;pointer-events:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;margin-bottom:6px}
.chips::-webkit-scrollbar{display:none}
.chip{
  padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);
  font-size:13px;white-space:nowrap;color:var(--muted)
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .c{font-size:11px;opacity:.6;margin-inline-start:4px}

.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
select.sel{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.count{font-size:13px;color:var(--muted);margin-inline-start:auto}

/* ---------- item rows ---------- */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line);position:relative}
.row:last-child{border-bottom:0}
.row.picked{background:var(--green-soft)}
.row.picked::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--green)}
.row.zero{background:var(--alert-soft)}
.row.zero::before{background:var(--alert)}
.row.picked{flex-direction:column;align-items:stretch;gap:9px}
.row .top{display:flex;align-items:flex-start;gap:8px;width:100%}
.rm{width:26px;height:26px;border-radius:99px;background:rgba(0,0,0,.05);color:var(--muted);
  font-size:13px;display:grid;place-items:center;flex-shrink:0}
.qrow{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.qrow .lbl{font-size:12.5px;color:var(--muted);width:40px;flex-shrink:0}
.qrow.h .lbl{color:var(--alert)}
.qrow .stepper button{width:30px}
.qrow .stepper .q{min-width:30px}
.ul{font-size:12px;color:var(--muted);flex-shrink:0;min-width:26px}
.ubtn{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;
  font-size:13px;color:var(--muted);font-weight:500;flex-shrink:0}
.ubtn.strip{border-color:#C6B79A;color:var(--amber);background:var(--amber-soft)}
.qhint{font-size:12px;color:var(--muted);padding-inline-start:46px;margin-top:-3px}
.qhint.z{color:var(--alert);font-weight:600}
.zflag{display:inline-block;font-size:11px;font-weight:600;color:var(--alert);background:#fff;
  border:1px solid #E9C3C0;border-radius:99px;padding:1px 7px;margin-inline-start:6px;vertical-align:middle}
.row .info{flex:1;min-width:0}
.row .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:11.5px;color:var(--muted);display:flex;gap:8px;margin-top:1px}
.row .meta b{font-weight:500;color:var(--amber)}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;flex-shrink:0}
.stepper button{width:34px;height:34px;font-size:17px;font-weight:600;color:var(--green);display:grid;place-items:center}
.stepper button:disabled{color:#C7D2CD}
.stepper .q{min-width:34px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;border-inline:1px solid var(--line);height:34px;line-height:34px;font-size:14px}
.row.picked .stepper{border-color:var(--green)}
.add{padding:8px 14px;border-radius:8px;background:var(--green-soft);color:var(--green);font-weight:600;font-size:13.5px;flex-shrink:0}

.empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px;font-size:15px}

/* ---------- bottom bar ---------- */
.bar{
  position:fixed;inset-inline:0;bottom:0;z-index:50;background:var(--card);
  border-top:1px solid var(--line);padding:10px 14px;
  padding-bottom:max(10px,env(safe-area-inset-bottom));
  display:flex;gap:10px;align-items:center;
  box-shadow:0 -2px 14px rgba(14,42,37,.07)
}
.bar .sum{flex:1;font-size:13px;color:var(--muted);line-height:1.35}
.bar .sum b{display:block;color:var(--ink);font-size:15px;font-weight:600}
.btn{padding:11px 18px;border-radius:9px;font-weight:600;font-size:14.5px;background:var(--ink);color:#fff}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.green{background:var(--green)}
.btn.wa{background:#1DA851;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:8px 13px;font-size:13.5px}
.btn.danger{background:var(--alert-soft);color:var(--alert)}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,42,37,.45);z-index:60;display:none}
.scrim.on{display:block}
.sheet{
  position:fixed;inset-inline:0;bottom:0;z-index:70;background:var(--paper);
  border-radius:16px 16px 0 0;max-height:88vh;display:none;flex-direction:column;
  max-width:760px;margin:0 auto;
}
.sheet.on{display:flex}
.sheet h2{margin:0;font-size:16px;font-weight:600}
.sheet .head{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line);background:var(--card);border-radius:16px 16px 0 0}
.sheet .body{overflow:auto;padding:14px;flex:1}
.sheet .foot{padding:12px 14px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card);display:flex;gap:8px;flex-wrap:wrap}
.x{margin-inline-start:auto;width:30px;height:30px;border-radius:99px;background:var(--paper);display:grid;place-items:center;font-size:16px;color:var(--muted)}

.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)
}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- archive / stats ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:10px;box-shadow:var(--shadow)}
.card .t{display:flex;align-items:baseline;gap:8px}
.card .t b{font-size:15px}
.card .t span{font-size:12.5px;color:var(--muted);margin-inline-start:auto}
.card .p{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .acts{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}

.stat{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat .rank{width:22px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat .nm{flex:1;font-size:14px}
.stat .bar{width:92px;height:7px;background:var(--paper);border-radius:99px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--green)}
.stat .v{width:34px;text-align:end;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}

.banner{background:var(--amber-soft);border:1px solid #E8D5A8;color:var(--amber);padding:10px 13px;border-radius:var(--r);font-size:13px;margin-bottom:12px;line-height:1.55}
.banner a{color:inherit}
.toast{
  position:fixed;bottom:96px;inset-inline:0;margin:0 auto;width:max-content;max-width:88%;
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:90;
  opacity:0;transform:translateY(8px);transition:.22s;pointer-events:none
}
.toast.on{opacity:1;transform:none}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
h3.sec{font-size:13px;color:var(--muted);font-weight:600;margin:18px 0 8px}

/* ---------- print ---------- */
#print{display:none}
@media print{
  body{background:#fff;padding:0}
  header,nav,.bar,.view,main,.sheet,.scrim,.toast{display:none !important}
  #print{display:block;padding:0;font-size:12px;color:#000}
  @page{size:A4;margin:14mm 12mm}
  #print .ph{display:flex;align-items:flex-end;border-bottom:2px solid #0E2A25;padding-bottom:8px;margin-bottom:4px}
  #print .ph h1{margin:0;font-size:19px}
  #print .ph .d{margin-inline-start:auto;text-align:end;font-size:11.5px;line-height:1.5}
  #print .note{font-size:11px;color:#444;margin:8px 0 12px}
  #print table{width:100%;border-collapse:collapse;margin-top:8px}
  #print th{background:#EDF2F0;font-size:11px;text-align:start;padding:6px 8px;border:1px solid #BCCBC5;font-weight:600}
  #print td{padding:5px 8px;border:1px solid #D6DEDA;font-size:11.5px}
  #print tr{break-inside:avoid}
  #print .q{text-align:center;font-weight:700;width:74px;font-variant-numeric:tabular-nums}
  #print .zcat{background:#FBE7E5;color:#B3261E}
  #print .i{text-align:center;width:34px;color:#666}
  #print .cat{font-weight:700;background:#F4F7F6;font-size:11.5px}
  #print .z{font-weight:700;color:#B3261E;font-size:10.5px;margin-inline-start:5px;white-space:nowrap}
  #print tr.zrow td{background:#FCF0EF}
  #print .bang{color:#B3261E;font-weight:700}
  #print .foot{margin-top:14px;padding-top:7px;border-top:1px solid #BCCBC5;font-size:11px;display:flex}
  #print .foot span:last-child{margin-inline-start:auto}
}
</style>
</head>

<header>
  <div class="brandrow">
    <div class="brand" id="phName">نواقص الصيدلية</div>
    <span class="status" id="dbStatus">…</span>
    <div class="today" id="todayLbl"></div>
  </div>
  <nav>
    <button data-v="log" aria-current="true">تسجيل النواقص</button>
    <button data-v="cat">الأصناف</button>
    <button data-v="arch">الأرشيف</button>
    <button data-v="stats">إحصائيات</button>
    <button data-v="set">الإعدادات</button>
  </nav>
</header>

<main>
  <!-- ========== LOG ========== -->
  <section class="view on" id="v-log">
    <div id="cfgBanner"></div>
    <div class="searchwrap">
      <input id="q" type="search" placeholder="ابحث عن صنف…" autocomplete="off">
      <span class="ico">⌕</span>
    </div>
    <div class="chips" id="catChips"></div>
    <div class="toolbar">
      <select class="sel" id="supFilter"><option value="">كل الموردين</option></select>
      <label style="font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px">
        <input type="checkbox" id="onlyPicked"> المختار فقط
      </label>
      <span class="count" id="listCount"></span>
    </div>
    <div class="list" id="itemList"></div>
  </section>

  <!-- ========== CATALOG ========== -->
  <section class="view" id="v-cat">
    <div class="toolbar">
      <button class="btn sm green" id="addItemBtn">+ صنف جديد</button>
      <button class="btn sm ghost" id="manageSupBtn">الموردين</button>
      <span class="count" id="catCount"></span>
    </div>
    <div class="searchwrap"><input id="q2" type="search" placeholder="ابحث في الأصناف…" autocomplete="off"><span class="ico">⌕</span></div>
    <div class="list" id="catList"></div>
  </section>

  <!-- ========== ARCHIVE ========== -->
  <section class="view" id="v-arch">
    <div id="archList"></div>
  </section>

  <!-- ========== STATS ========== -->
  <section class="view" id="v-stats">
    <div id="statsBox"></div>
  </section>

  <!-- ========== SETTINGS ========== -->
  <section class="view" id="v-set">
    <div class="card">
      <div class="field"><label>اسم الصيدلية (يظهر في الـ PDF والرسالة)</label>
        <input id="setName" placeholder="صيدلية …"></div>
      <div class="field"><label>رقم واتساب الدكتور (بكود الدولة، مثال 201001234567)</label>
        <input id="setWa" inputmode="numeric" placeholder="201001234567"></div>
      <button class="btn sm green" id="saveSet">حفظ الإعدادات</button>
    </div>
    <h3 class="sec">نسخة احتياطية</h3>
    <div class="card">
      <div style="font-size:13px;color:var(--muted);margin-bottom:10px">
        نزّل ملف فيه كل الأصناف والسجلات، أو ارفع ملف قديم لاستعادته.
      </div>
      <div class="card acts" style="border:0;padding:0;margin:0;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm ghost" id="expJson">تنزيل نسخة</button>
        <button class="btn sm ghost" id="impJson">استعادة من ملف</button>
        <input type="file" id="impFile" accept="application/json" hidden>
      </div>
    </div>
    <h3 class="sec">الاتصال بقاعدة البيانات</h3>
    <div class="card" style="font-size:13px;color:var(--muted);line-height:1.7" id="dbInfo"></div>
  </section>
</main>

<!-- bottom bar -->
<div class="bar">
  <div class="sum"><b id="barTitle">لسه مفيش نواقص</b><span id="barSub">دوس على الصنف الناقص وحدد الكمية</span></div>
  <button class="btn ghost sm" id="clearBtn" disabled>مسح</button>
  <button class="btn" id="reviewBtn" disabled>مراجعة</button>
</div>

<!-- review sheet -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="head"><h2 id="sheetTitle">مراجعة النواقص</h2><button class="x" id="sheetX">✕</button></div>
  <div class="body" id="sheetBody"></div>
  <div class="foot" id="sheetFoot"></div>
</div>

<div class="toast" id="toast"></div>

<!-- print surface -->
<div id="print"></div>

/* ---------- storage layer: firestore or localStorage ---------- */
const LS = {
  get(k,f){ try{ return JSON.parse(localStorage.getItem('rx_'+k)) ?? f }catch(e){ return f } },
  set(k,v){ try{ localStorage.setItem('rx_'+k, JSON.stringify(v)) }catch(e){} }
};

async function boot(){
  $('#todayLbl').textContent = AR_DATE(new Date());
  state.settings = LS.get('settings', {name:'',wa:''});

  if (FIREBASE_CONFIG.apiKey) {
    try {
      const [{initializeApp},fs] = await Promise.all([
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
      ]);
      const app = initializeApp(FIREBASE_CONFIG);
      const db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({tabManager: fs.persistentMultipleTabManager()}) });
      DB = { db, ...fs };
      state.mode = 'cloud';
      setStatus('متصل بالسحابة','on');
      await loadCloud();
    } catch(err){
      console.error(err);
      state.mode = 'local';
      setStatus('السحابة فشلت — محلي','off');
      loadLocal();
    }
  } else {
    setStatus('محلي على الجهاز','off');
    loadLocal();
    $('#cfgBanner').innerHTML = '<div class="banner">شغّال دلوقتي بذاكرة المتصفح بس. عشان البيانات تتزامن بين الموبايل والكمبيوتر، افتح ملف <b>index.html</b> وحط بيانات Firebase في أول السكريبت.</div>';
  }

  state.draft = LS.get('draft', {});
  renderAll();
}

function setStatus(t,c){ const e=$('#dbStatus'); e.textContent=t; e.className='status '+c; }

function loadLocal(){
  state.items = LS.get('items', null) || SEED.map(s => ({id:uid(), name:s.n, category:s.c, supplier:'', note:s.t||''}));
  state.records = LS.get('records', []);
  state.suppliers = LS.get('suppliers', []);
  LS.set('items', state.items);
}
function saveLocal(){
  LS.set('items', state.items); LS.set('records', state.records);
  LS.set('suppliers', state.suppliers); LS.set('draft', state.draft);
}

async function loadCloud(){
  const {db,collection,getDocs,writeBatch,doc,query,orderBy} = DB;
  const isnap = await getDocs(collection(db,'items'));
  if (isnap.empty){
    toast('بيرفع قائمة الأصناف لأول مرة…');
    for (let i=0;i<SEED.length;i+=450){
      const b = writeBatch(db);
      SEED.slice(i,i+450).forEach(s=>{
        b.set(doc(collection(db,'items')), {name:s.n, category:s.c, supplier:'', note:s.t||''});
      });
      await b.commit();
    }
    const again = await getDocs(collection(db,'items'));
    state.items = again.docs.map(d=>({id:d.id,...d.data()}));
  } else {
    state.items = isnap.docs.map(d=>({id:d.id,...d.data()}));
  }
  const rsnap = await getDocs(query(collection(db,'records'), orderBy('createdAt','desc')));
  state.records = rsnap.docs.map(d=>({id:d.id,...d.data()}));
  const ssnap = await getDocs(collection(db,'suppliers'));
  state.suppliers = ssnap.docs.map(d=>d.data().name);
}

/* ---------- writes ---------- */
async function itemSave(it){
  if (state.mode==='cloud'){
    const {db,doc,setDoc,collection,addDoc} = DB;
    if (it.id && !it._new) await setDoc(doc(db,'items',it.id), {name:it.name,category:it.category,supplier:it.supplier||'',note:it.note||''});
    else { const r = await addDoc(collection(db,'items'), {name:it.name,category:it.category,supplier:it.supplier||'',note:it.note||''}); it.id = r.id; }
  }
  delete it._new;
  saveLocal();
}
async function itemDelete(id){
  state.items = state.items.filter(i=>i.id!==id);
  delete state.draft[id];
  if (state.mode==='cloud'){ const {db,doc,deleteDoc}=DB; await deleteDoc(doc(db,'items',id)); }
  saveLocal();
}
async function recordSave(rec){
  if (state.mode==='cloud'){
    const {db,collection,addDoc} = DB;
    const r = await addDoc(collection(db,'records'), rec); rec.id = r.id;
  } else rec.id = uid();
  state.records.unshift(rec); saveLocal();
}
async function recordDelete(id){
  state.records = state.records.filter(r=>r.id!==id);
  if (state.mode==='cloud'){ const {db,doc,deleteDoc}=DB; await deleteDoc(doc(db,'records',id)); }
  saveLocal();
}
async function suppliersSave(){
  if (state.mode==='cloud'){
    const {db,collection,getDocs,writeBatch,doc} = DB;
    const snap = await getDocs(collection(db,'suppliers'));
    const b = writeBatch(db);
    snap.docs.forEach(d=>b.delete(d.ref));
    state.suppliers.forEach(n=>b.set(doc(collection(db,'suppliers')), {name:n}));
    await b.commit();
  }
  saveLocal();
}

function norm(s){ return (s||'').toLowerCase().replace(/[\s\-\/\.\,]/g,''); }

function visibleItems(){
  const q = norm(filter.q);
  return state.items.filter(i=>{
    if (filter.cat && i.category!==filter.cat) return false;
    if (filter.sup && (i.supplier||'')!==filter.sup) return false;
    if (filter.pickedOnly && !state.draft[i.id]) return false;
    if (q && !norm(i.name).includes(q) && !norm(i.supplier).includes(q)) return false;
    return true;
  });
}

function renderChips(){
  const counts = {};
  state.items.forEach(i=>counts[i.category]=(counts[i.category]||0)+1);
  const all = `<button class="chip" data-c="" aria-pressed="${filter.cat===''}">الكل<span class="c">${state.items.length}</span></button>`;
  $('#catChips').innerHTML = all + CATS.filter(c=>counts[c]).map(c=>
    `<button class="chip" data-c="${c}" aria-pressed="${filter.cat===c}">${c}<span class="c">${counts[c]}</span></button>`).join('');
  $$('#catChips .chip').forEach(b=>b.onclick=()=>{ filter.cat=b.dataset.c; renderChips(); renderList(); });
}

function renderSupFilter(){
  const cur = filter.sup;
  $('#supFilter').innerHTML = '<option value="">كل الموردين</option>' +
    state.suppliers.map(s=>`<option ${s===cur?'selected':''}>${esc(s)}</option>`).join('');
}

function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderList(){
  const items = visibleItems();
  $('#listCount').textContent = `${items.length} صنف`;
  if (!items.length){
    $('#itemList').innerHTML = `<div class="empty"><b>مفيش نتايج</b>جرّب كلمة تانية، أو ضيف الصنف من تبويب «الأصناف».</div>`;
    return;
  }
  const slice = items.slice(0, 400);
  $('#itemList').innerHTML = slice.map(i=>{
    const d = D(i.id);
    const meta = [i.category, i.supplier].filter(Boolean);
    const head = `<div class="info">
        <div class="nm en">${esc(i.name)}${d&&isZero(d)?'<span class="zflag">مفيش منه</span>':''}</div>
        <div class="meta">${meta.map((m,ix)=>ix===1?`<b>${esc(m)}</b>`:`<span>${esc(m)}</span>`).join('')}</div>
      </div>`;
    if (!d) return `<div class="row" data-id="${i.id}">${head}<button class="add" data-a="pick">ناقص</button></div>`;
    const step = (f,v)=>`<div class="stepper">
        <button data-a="-" data-f="${f}">−</button><span class="q">${v}</span><button data-a="+" data-f="${f}">+</button>
      </div>`;
    const z = isZero(d);
    return `<div class="row picked ${z?'zero':''}" data-id="${i.id}">
      <div class="top">${head}<button class="rm" data-a="rm" title="شيله من الكشف">✕</button></div>
      <div class="qrow h"><span class="lbl">موجود</span>
        ${step('hb',d.hb)}<span class="ul">علب</span>
        ${step('hs',d.hs)}<span class="ul">شرايط</span></div>
      <div class="qhint ${z?'z':''}">${z?'مفيش منه ولا حاجة':'موجود منه '+haveText(d)}</div>
      <div class="qrow"><span class="lbl">محتاج</span>${step('nq',d.nq)}
        <button class="ubtn ${d.nu===STRIP?'strip':''}" data-a="un">${d.nu}</button></div>
      <div class="qhint">محتاج ${plural(d.nq,d.nu)}</div>
    </div>`;
  }).join('') + (items.length>400 ? `<div class="empty">بيعرض أول 400 صنف — ابحث للوصول لباقي ${items.length-400}.</div>`:'');

  $$('#itemList .row').forEach(r=>{
    r.querySelectorAll('[data-a]').forEach(b=>b.onclick=ev=>{
      ev.stopPropagation();
      const a=b.dataset.a, id=r.dataset.id;
      if (a==='pick') pick(id);
      else if (a==='rm') unpick(id);
      else if (a==='un') flipUnit(id,'nu');
      else bump(id, b.dataset.f, a==='+'?1:-1);
    });
    r.onclick = () => { if (!D(r.dataset.id)) pick(r.dataset.id); };
  });
}

/* وحدات القياس + الجمع بالعربي */
const BOX='علبة', STRIP='شريط';
function plural(n, unit){
  if (unit===STRIP) return n===1?'شريط':n===2?'شريطين':(n<=10?`${n} شرايط`:`${n} شريط`);
  return n===1?'علبة':n===2?'علبتين':(n<=10?`${n} علب`:`${n} علبة`);
}
/* قراءة سطر المسودة مع ترقية أي صيغة قديمة */
/* الموجود = علب + شرايط مع بعض. المطلوب = رقم + وحدة واحدة. */
function up(d){
  if (d==null) return null;
  if (typeof d === 'number') return {hb:0, hs:0, nq:d, nu:BOX};
  if ('q' in d) return {hb: d.z?0:1, hs:0, nq:d.q, nu:BOX};          // صيغة قديمة
  if ('hq' in d) return {hb: d.hu===STRIP?0:d.hq, hs: d.hu===STRIP?d.hq:0,
                         nq: d.nq??1, nu: d.nu||BOX};                 // صيغة الوحدة الواحدة
  return {hb: d.hb??0, hs: d.hs??0, nq: d.nq??1, nu: d.nu||BOX};
}
function D(id){ return up(state.draft[id]); }
/* توحيد سطور الكشوف القديمة المحفوظة */
function NL(l){
  if ('hb' in l) return l;
  if ('hq' in l) return {...l, hb: l.hu===STRIP?0:l.hq, hs: l.hu===STRIP?l.hq:0};
  return {...l, hb: l.zero?0:1, hs:0, nq: l.qty??0, nu:BOX};
}
const isZero = l => (l.hb||0)===0 && (l.hs||0)===0;
function haveText(l){
  const parts = [];
  if (l.hb) parts.push(plural(l.hb, BOX));
  if (l.hs) parts.push(plural(l.hs, STRIP));
  return parts.join(' و');
}
function setD(id, patch){
  const cur = D(id) || {hb:0, hs:0, nq:1, nu:BOX};
  state.draft[id] = {...cur, ...patch};
  LS.set('draft', state.draft);
  renderList(); renderBar();
}
function pick(id){ setD(id, {}); }
function unpick(id){ delete state.draft[id]; LS.set('draft', state.draft); renderList(); renderBar(); }
function bump(id, field, delta){
  const cur = D(id); if (!cur) return;
  const min = field==='nq' ? 1 : 0;
  setD(id, { [field]: Math.max(min, Math.min(999, cur[field]+delta)) });
}

function flipUnit(id, field){
  const cur = D(id); if (!cur) return;
  setD(id, { [field]: cur[field]===BOX ? STRIP : BOX });
}

/* التجميع حسب الموجود */
function gKey(l){ return isZero(l) ? 'z' : (l.hb||0)+'|'+(l.hs||0); }
function gLabel(l){ return isZero(l) ? 'مفيش منه خالص' : 'موجود منه ' + haveText(l); }
function sortLines(ls){
  return ls.slice().sort((a,b)=>
    (a.hb||0)-(b.hb||0) || (a.hs||0)-(b.hs||0) || a.name.localeCompare(b.name));
}

function draftLines(){
  return sortLines(Object.keys(state.draft).map(id=>{
    const d = D(id), it = state.items.find(i=>i.id===id);
    return (it && d) ? {name:it.name, category:it.category, supplier:it.supplier||'', ...d} : null;
  }).filter(Boolean));
}

function renderBar(){
  const ls = draftLines(), n = ls.length, zn = ls.filter(isZero).length;
  $('#barTitle').textContent = n ? `${n} صنف ناقص` : 'لسه مفيش نواقص';
  $('#barSub').textContent = n
    ? (zn ? `منها ${zn} مفيش منه خالص` : 'كلها موجودة بكميات قليلة')
    : 'دوس على الصنف الناقص وحدد الكميات';
  $('#reviewBtn').disabled = !n; $('#clearBtn').disabled = !n;
}

$('#clearBtn').onclick = ()=>{ if(confirm('تمسح كل النواقص المسجلة دلوقتي؟')){ state.draft={}; LS.set('draft',{}); renderList(); renderBar(); } };

/* ---------- sheet ---------- */
function openSheet(title, body, foot){
  $('#sheetTitle').textContent = title;
  $('#sheetBody').innerHTML = body;
  $('#sheetFoot').innerHTML = '';
  (foot||[]).forEach(f=>{
    const b=document.createElement('button'); b.className='btn sm '+(f.cls||'ghost'); b.textContent=f.label; b.onclick=f.on;
    $('#sheetFoot').appendChild(b);
  });
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
}
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#scrim').onclick = closeSheet; $('#sheetX').onclick = closeSheet;

$('#reviewBtn').onclick = ()=>{
  const lines = draftLines();
  openSheet('مراجعة النواقص', reviewHtml(lines, new Date()), [
    {label:'حفظ في الأرشيف', cls:'green', on:saveToday},
    {label:'تصدير PDF', on:()=>doPrint(lines, new Date(), '')},
    {label:'إرسال واتساب', cls:'wa', on:()=>sendWa(lines, new Date())},
  ]);
};

function reviewHtml(rawLines, date){
  const lines = sortLines(rawLines.map(NL));
  const zn = lines.filter(isZero).length;
  let html = `<div style="font-size:13px;color:var(--muted);margin-bottom:10px">${AR_DATE(date)} — ${lines.length} صنف${zn?` <span style="color:var(--alert);font-weight:600">• ${zn} مفيش منه</span>`:''}</div>`;
  let cur='';
  html += '<div class="list">';
  lines.forEach(l=>{
    if (gKey(l)!==cur){ cur=gKey(l); html += `<div class="row" style="background:var(--paper);padding:7px 13px"><div class="info" style="font-size:12px;color:${isZero(l)?'var(--alert)':'var(--muted)'};font-weight:600">${esc(gLabel(l))}</div></div>`; }
    html += `<div class="row ${isZero(l)?'zero':''}"><div class="info"><div class="nm en">${esc(l.name)}</div>${l.supplier?`<div class="meta"><b>${esc(l.supplier)}</b></div>`:''}</div><span style="font-weight:600;font-size:13px">${esc(plural(l.nq,l.nu))}</span></div>`;
  });
  html += '</div>';
  html += `<div class="field" style="margin-top:12px"><label>ملاحظة على الطلبية (اختياري)</label><textarea id="recNote" rows="2" placeholder="مثال: محتاجين Congestal بسرعة"></textarea></div>`;
  return html;
}

async function saveToday(){
  const lines = draftLines();
  const note = ($('#recNote')?.value || '').trim();
  const now = new Date();
  await recordSave({ date: KEY(now), dateLabel: AR_DATE(now), createdAt: now.getTime(), note, lines,
                     total: lines.length, zeroCount: lines.filter(isZero).length });
  state.draft = {}; LS.set('draft',{});
  closeSheet(); renderList(); renderBar(); toast('اتحفظ في الأرشيف ✓');
}

/* ---------- whatsapp ---------- */
function waText(rawLines, date, note){
  const lines = sortLines(rawLines.map(NL));
  const head = (state.settings.name || 'الصيدلية') + ' — نواقص ' + AR_DATE(date);
  let out = '*' + head + '*\n' + '—'.repeat(14) + '\n';
  let cur='';
  lines.forEach(l=>{
    if (gKey(l)!==cur){ cur=gKey(l); out += `\n*${isZero(l)?'❗ ':''}${gLabel(l)}*\n`; }
    out += `• ${l.name} — محتاج ${plural(l.nq,l.nu)}\n`;
  });
  const zn = lines.filter(isZero).length;
  out += '\n' + '—'.repeat(14) + `\nالإجمالي: ${lines.length} صنف`;
  if (zn) out += `\n❗ منها ${zn} صنف مفيش منه خالص`;
  if (note) out += `\nملاحظة: ${note}`;
  return out;
}
function sendWa(lines, date){
  const note = ($('#recNote')?.value || '').trim();
  const txt = encodeURIComponent(waText(lines, date, note));
  const n = (state.settings.wa||'').replace(/\D/g,'');
  window.open(n ? `https://wa.me/${n}?text=${txt}` : `https://wa.me/?text=${txt}`, '_blank');
}

/* ---------- print / pdf ---------- */
function doPrint(rawLines, date, note){
  const lines = sortLines(rawLines.map(NL));
  const n = ($('#recNote')?.value || note || '').trim();
  let rows='', cur='';
  lines.forEach(l=>{
    if (gKey(l)!==cur){ cur=gKey(l);
      rows += `<tr><td class="cat ${isZero(l)?'zcat':''}" colspan="3">${isZero(l)?'❗ ':''}${esc(gLabel(l))}</td></tr>`; }
    rows += `<tr class="${isZero(l)?'zrow':''}">`
         +  `<td style="text-align:start"><span dir="ltr">${esc(l.name)}</span></td>`
         +  `<td>${esc(l.supplier||'—')}</td><td class="q">${esc(plural(l.nq,l.nu))}</td></tr>`;
  });
  $('#print').innerHTML = `
    <div class="ph">
      <h1>${esc(state.settings.name || 'نواقص الصيدلية')}</h1>
      <div class="d"><div>كشف النواقص</div><div>${AR_DATE(date)}</div></div>
    </div>
    ${n?`<div class="note">ملاحظة: ${esc(n)}</div>`:''}
    <table>
      <thead><tr><th>الصنف</th><th style="width:100px">المورد</th><th style="width:78px">المطلوب</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="foot"><span>إجمالي الأصناف الناقصة: ${lines.length}${lines.filter(isZero).length?` &nbsp;—&nbsp; منها <span class="bang">❗</span> ${lines.filter(isZero).length} مفيش منه خالص`:''}</span><span>${esc(state.settings.name||'')}</span></div>`;
  window.print();
}

/* ---------- catalog management ---------- */
function renderCatalog(){
  const q = norm($('#q2').value);
  const list = state.items.filter(i=>!q || norm(i.name).includes(q)).slice(0,400);
  $('#catCount').textContent = `${state.items.length} صنف`;
  $('#catList').innerHTML = list.length ? list.map(i=>`
    <div class="row" data-id="${i.id}">
      <div class="info"><div class="nm en">${esc(i.name)}</div>
        <div class="meta"><span>${esc(i.category)}</span>${i.supplier?`<b>${esc(i.supplier)}</b>`:''}</div></div>
      <button class="btn sm ghost" data-edit>تعديل</button>
    </div>`).join('') : `<div class="empty"><b>مفيش نتايج</b>ممكن تضيف الصنف جديد.</div>`;
  $$('#catList [data-edit]').forEach(b=>b.onclick=()=>editItem(b.closest('.row').dataset.id));
}

function editItem(id){
  const it = id ? state.items.find(i=>i.id===id) : {id:uid(), name:'', category:'أقراص', supplier:'', note:'', _new:true};
  openSheet(id?'تعديل صنف':'صنف جديد', `
    <div class="field"><label>اسم الصنف</label><input id="fName" dir="ltr" value="${esc(it.name)}" placeholder="Congestal Tab"></div>
    <div class="two">
      <div class="field"><label>التصنيف</label><select id="fCat">${CATS.map(c=>`<option ${c===it.category?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label>المورد (اختياري)</label><select id="fSup"><option value="">—</option>${state.suppliers.map(s=>`<option ${s===it.supplier?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>ملاحظة (اختياري)</label><input id="fNote" value="${esc(it.note||'')}" placeholder="مثال: من تبارك"></div>
  `, [
    {label:'حفظ', cls:'green', on:async()=>{
      const nm = $('#fName').value.trim();
      if (!nm) return toast('اكتب اسم الصنف');
      it.name=nm; it.category=$('#fCat').value; it.supplier=$('#fSup').value; it.note=$('#fNote').value.trim();
      if (!state.items.find(i=>i.id===it.id)) state.items.push(it);
      await itemSave(it);
      state.items.sort((a,b)=>a.name.localeCompare(b.name));
      closeSheet(); renderCatalog(); renderChips(); renderList(); toast('اتحفظ ✓');
    }},
    ...(id?[{label:'حذف', cls:'danger', on:async()=>{
      if(!confirm('تحذف الصنف ده نهائي؟')) return;
      await itemDelete(id); closeSheet(); renderCatalog(); renderChips(); renderList(); renderBar(); toast('اتحذف');
    }}]:[]),
    {label:'إلغاء', on:closeSheet}
  ]);
}
$('#addItemBtn').onclick = ()=>editItem(null);

$('#manageSupBtn').onclick = ()=>{
  const draw = ()=> state.suppliers.length
    ? state.suppliers.map((s,ix)=>`<div class="row"><div class="info"><div class="nm">${esc(s)}</div></div><button class="btn sm danger" data-i="${ix}">حذف</button></div>`).join('')
    : '<div class="empty"><b>مفيش موردين</b>ضيف المورد عشان تربط بيه الأصناف وتفلتر بيه.</div>';
  const body = `<div class="field"><label>إضافة مورد</label>
      <div style="display:flex;gap:8px"><input id="supNew" placeholder="اسم المورد"><button class="btn sm green" id="supAdd">إضافة</button></div></div>
      <div class="list" id="supList">${draw()}</div>`;
  openSheet('الموردين', body, [{label:'تم', cls:'green', on:async()=>{ await suppliersSave(); closeSheet(); renderSupFilter(); renderCatalog(); }}]);
  const rebind = ()=>{
    $('#supList').innerHTML = draw();
    $$('#supList [data-i]').forEach(b=>b.onclick=()=>{ state.suppliers.splice(+b.dataset.i,1); rebind(); });
  };
  $('#supAdd').onclick = ()=>{
    const v = $('#supNew').value.trim();
    if (!v || state.suppliers.includes(v)) return;
    state.suppliers.push(v); $('#supNew').value=''; rebind();
  };
  rebind();
};

/* ---------- archive ---------- */
function renderArchive(){
  if (!state.records.length){
    $('#archList').innerHTML = `<div class="card"><div class="empty"><b>الأرشيف فاضي</b>أول ما تحفظ كشف نواقص هيظهر هنا بتاريخه.</div></div>`;
    return;
  }
  $('#archList').innerHTML = state.records.map(r=>`
    <div class="card" data-id="${r.id}">
      <div class="t"><b>${esc(r.dateLabel||r.date)}</b><span>${r.total} صنف${r.lines.map(NL).filter(isZero).length?` • ${r.lines.map(NL).filter(isZero).length} مفيش منه`:''}</span></div>
      <div class="p en">${sortLines(r.lines.map(NL)).slice(0,8).map(l=>(isZero(l)?'❗':'')+esc(l.name)+' ('+l.nq+')').join('، ')}${r.lines.length>8?' …':''}</div>
      <div class="acts">
        <button class="btn sm ghost" data-a="view">عرض</button>
        <button class="btn sm ghost" data-a="pdf">PDF</button>
        <button class="btn sm wa" data-a="wa">واتساب</button>
        <button class="btn sm ghost" data-a="reuse">افتحه كمسودة</button>
        <button class="btn sm danger" data-a="del">حذف</button>
      </div>
    </div>`).join('');
  $$('#archList .card').forEach(c=>{
    const r = state.records.find(x=>x.id===c.dataset.id);
    c.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{
      const a=b.dataset.a, d=new Date(r.createdAt);
      if (a==='view') openSheet(r.dateLabel||r.date, reviewHtml(r.lines,d).replace(/<div class="field"[\s\S]*<\/div>$/,''), [
        {label:'PDF', on:()=>doPrint(r.lines,d,r.note)},
        {label:'واتساب', cls:'wa', on:()=>{ const t=encodeURIComponent(waText(r.lines,d,r.note)); const n=(state.settings.wa||'').replace(/\D/g,''); window.open(n?`https://wa.me/${n}?text=${t}`:`https://wa.me/?text=${t}`,'_blank'); }},
        {label:'إغلاق', on:closeSheet}
      ]);
      if (a==='pdf') doPrint(r.lines,d,r.note);
      if (a==='wa'){ const t=encodeURIComponent(waText(r.lines,d,r.note)); const n=(state.settings.wa||'').replace(/\D/g,''); window.open(n?`https://wa.me/${n}?text=${t}`:`https://wa.me/?text=${t}`,'_blank'); }
      if (a==='reuse'){
        r.lines.forEach(l=>{ const x=NL(l); const it=state.items.find(i=>i.name===x.name);
          if(it) state.draft[it.id]={hb:x.hb||0, hs:x.hs||0, nq:x.nq, nu:x.nu||BOX}; });
        LS.set('draft',state.draft); renderList(); renderBar(); toast('اتنقل للمسودة ✓');
      }
      if (a==='del'){ if(confirm('تحذف الكشف ده؟')){ await recordDelete(r.id); renderArchive(); } }
    });
  });
}

/* ---------- stats ---------- */
function renderStats(){
  if (!state.records.length){
    $('#statsBox').innerHTML = `<div class="card"><div class="empty"><b>لسه مفيش بيانات</b>الإحصائيات بتظهر بعد ما تحفظ كشوف نواقص.</div></div>`;
    return;
  }
  const freq={}, qty={}, zfreq={};
  state.records.forEach(r=>r.lines.map(NL).forEach(l=>{ freq[l.name]=(freq[l.name]||0)+1; qty[l.name]=(qty[l.name]||0)+l.nq;
    if (isZero(l)) zfreq[l.name]=(zfreq[l.name]||0)+1; }));
  const ztop = Object.entries(zfreq).sort((a,b)=>b[1]-a[1]).slice(0,15);
  const zmax = ztop[0]?.[1]||1;
  const top = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,25);
  const max = top[0]?.[1] || 1;
  const catFreq={};
  state.records.forEach(r=>r.lines.forEach(l=>catFreq[l.category]=(catFreq[l.category]||0)+1));
  // (التصنيف اتشال من الكشوف نفسها، بس لسه مفيد كإحصائية)
  const catTop = Object.entries(catFreq).sort((a,b)=>b[1]-a[1]);
  const cmax = catTop[0]?.[1]||1;

  $('#statsBox').innerHTML = `
    <div class="card"><div class="t"><b>${state.records.length}</b><span>كشف محفوظ</span></div>
      <div class="p">أول كشف: ${esc(state.records[state.records.length-1].dateLabel||'')} — آخر كشف: ${esc(state.records[0].dateLabel||'')}</div></div>
    <h3 class="sec">الأصناف اللي بتنقص أكتر</h3>
    <div class="card">${top.map(([n,c],ix)=>`
      <div class="stat"><span class="rank">${ix+1}</span><span class="nm en">${esc(n)}</span>
      <span class="bar"><i style="width:${Math.round(c/max*100)}%"></i></span><span class="v">${c}</span></div>`).join('')}</div>
    ${ztop.length?`<h3 class="sec">الأصناف اللي بتخلص خالص أكتر</h3>
    <div class="card">${ztop.map(([n,c],ix)=>`
      <div class="stat"><span class="rank">${ix+1}</span><span class="nm en">${esc(n)}</span>
      <span class="bar"><i style="width:${Math.round(c/zmax*100)}%;background:var(--alert)"></i></span><span class="v">${c}</span></div>`).join('')}</div>`:''}
    <h3 class="sec">النقص حسب التصنيف</h3>
    <div class="card">${catTop.map(([n,c])=>`
      <div class="stat"><span class="nm">${esc(n)}</span>
      <span class="bar"><i style="width:${Math.round(c/cmax*100)}%"></i></span><span class="v">${c}</span></div>`).join('')}</div>`;
}

/* ---------- settings ---------- */
function renderSettings(){
  $('#setName').value = state.settings.name||'';
  $('#setWa').value = state.settings.wa||'';
  $('#dbInfo').innerHTML = state.mode==='cloud'
    ? 'متصل بـ Firebase — كل حاجة بتتسجل في السحابة وبتشتغل أوفلاين وتتزامن لما النت يرجع.'
    : 'شغّال على ذاكرة المتصفح. البيانات على الجهاز ده بس. لتفعيل المزامنة، حط بيانات Firebase في أول ملف index.html.';
}
$('#saveSet').onclick = ()=>{
  state.settings = { name: $('#setName').value.trim(), wa: $('#setWa').value.replace(/\D/g,'') };
  LS.set('settings', state.settings);
  $('#phName').textContent = state.settings.name || 'نواقص الصيدلية';
  toast('اتحفظ ✓');
};
$('#expJson').onclick = ()=>{
  const blob = new Blob([JSON.stringify({items:state.items,records:state.records,suppliers:state.suppliers,settings:state.settings},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`pharmacy-backup-${KEY(new Date())}.json`; a.click();
};
$('#impJson').onclick = ()=>$('#impFile').click();
$('#impFile').onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const d=JSON.parse(rd.result);
    if(d.items) state.items=d.items; if(d.records) state.records=d.records;
    if(d.suppliers) state.suppliers=d.suppliers; if(d.settings) state.settings=d.settings;
    saveLocal(); renderAll(); toast('اتستعادت ✓ — لو على السحابة، عدّل صنف عشان يترفع');
  }catch(err){ toast('الملف مش سليم'); } };
  rd.readAsText(f);
};

/* ---------- misc ---------- */
let tT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('on'),2400); }

function renderAll(){
  $('#phName').textContent = state.settings.name || 'نواقص الصيدلية';
  state.items.sort((a,b)=>a.name.localeCompare(b.name));
  renderChips(); renderSupFilter(); renderList(); renderBar();
}

boot();
</script>
